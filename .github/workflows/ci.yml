# SDK CI: client contract tests + integration-registry schema validation.
# Zero dependencies, so no npm ci — the Node global API surface (fetch,
# AbortSignal.timeout, node:test) is the whole stack.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-tests:
    name: Client contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: npm test

  registry:
    name: Integration registry schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate registry
        run: npm run validate:registry
